name: Node version

# The server runs its own copy of Node, at the version in .node-version, and
# nothing updates it by itself. Once a week this looks for a newer release of
# the same major version and fails if there is one, so that it is seen.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Is the pinned Node current?
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .node-version
          sparse-checkout-cone-mode: false
      - name: Compare with the newest release of the same major version
        run: |
          pinned=$(tr -d 'v \n' < .node-version)
          major=${pinned%%.*}
          newest=$(curl -fsS --max-time 30 https://nodejs.org/dist/index.json |
            jq -r --arg major "v$major." '[.[] | select(.version | startswith($major))][0].version' | tr -d v)
          echo "The site runs Node $pinned. The newest Node $major is $newest."
          if [ "$pinned" != "$newest" ]; then
            echo "::error::Node $newest is out. Change .node-version, run the tests and release."
            exit 1
          fi
