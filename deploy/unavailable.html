<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Back in a moment · Ukingo</title>
    <style>
      html {
        background: #101d26;
        color: #f6f8f5;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        line-height: 1.6;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 2rem 1.25rem;
        box-sizing: border-box;
      }
      main {
        max-width: 36rem;
        width: 100%;
        margin: 0 auto;
      }
      .label {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #f6c877;
        margin: 0;
      }
      h1 {
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: 2.75rem;
        line-height: 1.05;
        margin: 1rem 0 0;
      }
      p.lead {
        font-size: 1.125rem;
        color: #edf1ec;
        margin: 1.25rem 0 0;
      }
      a {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.8rem 1.4rem;
        border-radius: 999px;
        background: #e5a23a;
        color: #0a141a;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #f6c877;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Ukingo</p>
      <h1>We will be back in a moment.</h1>
      <p class="lead">
        The site is not answering just now. Nothing you entered has been lost or charged. Please try again in a minute.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
