# ukingo.jeffgicharu.com
# Installed as /etc/nginx/sites-available/ukingo.jeffgicharu.com by deploy/provision.sh.

# The application runs in one of two slots. The file included here names the
# live one, and is the only thing a release changes in nginx.
upstream ukingo_app {
    include /etc/nginx/ukingo/upstream.conf;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ukingo.jeffgicharu.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name ukingo.jeffgicharu.com;

    server_tokens off;
    charset utf-8;
    client_max_body_size 12m;

    # Cloudflare origin certificate, shared by every site on this server.
    ssl_certificate /etc/ssl/cloudflare/jeffgicharu.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jeffgicharu.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/ukingo.access.log;
    error_log /var/log/nginx/ukingo.error.log;

    # The site sits behind Cloudflare, so take the visitor's address from
    # Cloudflare's header, and only when the connection comes from Cloudflare.
    # Ranges from https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml text/x-component application/json application/manifest+json application/javascript application/xml image/svg+xml;

    # What the application sees of each request.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # If the application cannot answer, visitors get the lodge's own page,
    # not the web server's.
    error_page 502 503 504 /unavailable.html;
    location = /unavailable.html {
        root /var/www/ukingo.jeffgicharu.com/shared/pages;
        internal;
    }

    # Scripts, styles and fonts carry a fingerprint in their name and never
    # change. They are kept for every release still on disk, so a page from
    # the release before can still load what it needs.
    location /_next/static/ {
        root /var/www/ukingo.jeffgicharu.com/shared/static;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @app;
    }

    # Staff screens keep one connection open and are told when something
    # changes. Nothing may hold that stream back.
    location = /desk/live {
        proxy_pass http://ukingo_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        gzip off;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://ukingo_app;
    }

    location @app {
        proxy_pass http://ukingo_app;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
